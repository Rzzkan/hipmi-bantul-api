# Nginx — api.hipmibantul.com (Laravel CMS + API)
# SSL: sudo certbot --nginx -d api.hipmibantul.com
server {
    listen 80;
    server_name api.hipmibantul.com;
    root /var/www/hipmi-bantul-api/public;
    index index.php;

    client_max_body_size 10M;   # upload gambar dari admin

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Gambar upload: cache lama di browser/CDN
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
